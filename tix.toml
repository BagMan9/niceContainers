# tix.toml — niceContainers standalone library.
#
# STUBLESS. tix does static, local inference and does NOT evaluate the NixOS
# module system, so it cannot trace the type of `cfg` (= config.niceContainers)
# or the model.nix return value. Rather than a separate .tix stub applied by a
# [context], those shapes live as doc-comment `type` aliases in the files that
# own them — NiceContainersConfig at the top of default.nix, NiceContainersModel
# at the top of model.nix — and every module file references them with inline
# annotations on its parameters, e.g.
#   # type: cfg :: import("./default.nix").NiceContainersConfig
# The pure functions in lib.nix need nothing — tix infers them natively; Lib and
# Pkgs are compiled into tix and applied via `# type: lib :: Lib` annotations.
#
# No [stubs.generate] (so no `nix build` / darwin patchelf issue) and no giant
# nixos option tree.

# Background inference so cross-file `import ./model.nix` types flow to consumers.
[project]
includes = ["*.nix"]
excludes = ["flake.nix"]

[stubs]
stubs = ["@nixos", "./mystubs.tix"]
